<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>桥面伸缩缝复测送检</title>
<link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/components.css"><link rel="stylesheet" href="/static/layout.css">
<script defer src="/static/workbench.js"></script></head>
<body data-visual="bridge">
<a href="#work-area" class="skip">跳到工作内容</a>
<div class="frame">
<nav aria-label="工作台导航"><span class="brand">市政桥面养护</span><a href="#chart_panel">热校正偏差</a><a href="#queue_panel">送检单据</a><a href="#check_panel">回放核验</a></nav>
<div class="workspace" id="work-area">
<header class="topbar">
<div><h1>桥面伸缩缝复测送检</h1><p class="context">桥面养护巡查组长 · 生成伸缩缝送检联</p></div>
<div><form class="controls" id="controls"><label>复测车辆时段<input id="capacity" type="number" min="0" max="100" value="12" required></label>
<button class="action" id="simulate">试算分派</button><button class="action secondary" id="register" type="button" disabled>登记当前方案</button></form>
<div class="operation-message"><output id="message" aria-live="polite">正在载入单据…</output><a id="release_version" hidden>查看登记版</a></div></div></header>
<main class="sheet">
<section class="kpis" aria-label="本批次概况"><div class="kpi"><span>候选复测件</span><strong id="metric_cases">—</strong></div>
<div class="kpi"><span>本轮已排入</span><strong id="metric_queue">—</strong></div><div class="kpi"><span>锁定及转人工</span><strong id="metric_held">—</strong></div>
<div class="kpi"><span>车辆窗口 / 本轮额度</span><strong id="metric_used">—</strong></div></section>
<section class="panel picture" id="chart_panel"><div class="panel-title"><h2>热校正偏差</h2><span>业务证据</span></div>
<canvas id="chart" aria-label="热校正偏差。下方单据与图形使用同一份方案。" role="img"></canvas><p class="caption">每个标记对应一笔读数，竖线显示回放估计区间。</p><aside class="inspection-leaf" aria-label="复测量和许可分钟"><h3>本次送检联</h3><dl id="scene"></dl></aside></section>
<section class="panel queue-panel" id="queue_panel"><div class="panel-title"><h2>送检单据</h2><span id="result_count">—</span></div>
<div class="filters"><label>复测件号<input id="search" type="search" placeholder="按编号搜索" autocomplete="off"></label>
<label>业务分组<select id="cohort"><option value="">全部分组</option></select></label>
<label>裁决状态<select id="disposition"><option value="">全部状态</option><option value="allocated">已排入</option><option value="held">业务锁定</option><option value="manual">人工复核</option><option value="deferred">待排额度</option><option value="monitor">暂不处理</option></select></label></div>
<div class="table-scroll" tabindex="0" role="region" aria-label="送检单据"><table><thead><tr><th scope="col">复测件</th><th scope="col">分组</th><th scope="col">估计</th><th scope="col">额度</th><th scope="col">状态</th></tr></thead><tbody id="queue"></tbody></table></div></section>
<section class="panel detail-panel"><div class="panel-title"><h2>复测件证据</h2></div><div id="detail"><p>从队列选择单据。</p></div></section>
<section class="panel replay model-paper" id="check_panel"><div class="panel-title"><h2>回放核验</h2></div><p id="model_line"></p><strong id="replay_loss">—</strong><p id="replay_metric"></p><p>候选模型 / 分组基线</p><p id="replay_count"></p><ul id="regimes"></ul></section>
</main><footer class="statusbar"><span id="run_ticket">—</span><span>演练档案</span><a class="export-action" id="export" href="/api/decisions.csv">导出当前单据 CSV</a></footer>
</div></div></body></html>
